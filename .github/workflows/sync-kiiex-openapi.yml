# This workflow is triggered externally by a repository_dispatch event
# This is used to update cross references between KiiEx Backend and the docs
# Reference:
# https://github.com/KiiEx/kiiex-backend/blob/main/.github/workflows/trigger-docs-update.yaml
name: Sync KiiEx API Reference

on:
  # Triggered by a repository_dispatch event from KiiEx Backend when a new release is published
  repository_dispatch:
    types: [kiiex-backend-release]
  workflow_dispatch:
    inputs:
      ref:
        description: "kiiex-backend tag or release to sync (e.g. v1.9.1)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-kiiex-openapi-${{ github.event.client_payload.tag_name || inputs.ref }}
  cancel-in-progress: false

jobs:
  # Sync API reference from KiiEx Backend
  sync-api-reference:
    runs-on: ubuntu-latest
    env:
      SWAGGER_PATH: kiiex-backend-src/docs/openapi/kiiex_openapi_public.swagger.json
    steps:
      # Resolve the target reference
      - name: Resolve target ref
        id: ref
        run: |
          REF="${{ github.event.client_payload.tag_name || inputs.ref }}"
          if [ -z "$REF" ]; then
            echo "No tag/release was provided by the trigger" >&2
            exit 1
          fi
          echo "value=$REF" >> "$GITHUB_OUTPUT"

      # Checkout the kiichain-docs repository and the specified kiiex-backend reference
      - name: Checkout kiichain-docs
        uses: actions/checkout@v4

      - name: Checkout kiiex-backend@${{ steps.ref.outputs.value }}
        uses: actions/checkout@v4
        with:
          repository: KiiEx/kiiex-backend
          ref: ${{ steps.ref.outputs.value }}
          token: ${{ secrets.KIIEX_BACKEND_TOKEN }}
          path: kiiex-backend-src
          persist-credentials: false

      # Set up Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Generate the API reference from the OpenAPI spec in kiiex-backend
      - name: Generate API reference
        run: |
          python3 scripts/generate_api_reference.py \
            --swagger "$SWAGGER_PATH"

      # Publish the raw OpenAPI spec to GitBook
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish OpenAPI spec to GitBook
        env:
          GITBOOK_TOKEN: ${{ secrets.GITBOOK_TOKEN }}
        run: |
          npm install -g @gitbook/cli
          gitbook openapi publish \
            --spec kiichain-pay-swagger \
            --organization ks86i4iqH9J4cIKjsWqx \
            "$SWAGGER_PATH"

      # Drop the cloned kiiex-backend
      - name: Remove kiiex-backend checkout
        run: rm -rf kiiex-backend-src

      # Commit and push changes if any
      - name: Open PR with any changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs(automated): sync with kiiex-backend@${{ steps.ref.outputs.value }}"
          branch: docs/api-reference-${{ steps.ref.outputs.value }}
          delete-branch: true
          base: main
          title: "docs(automated): sync with kiiex-backend@${{ steps.ref.outputs.value }}"
          body: |
            Automated update of the kiichain-pay API reference, regenerated from
            `docs/openapi/kiiex_openapi_public.swagger.json` in
            [KiiEx/kiiex-backend@${{ steps.ref.outputs.value }}](${{ github.event.client_payload.release_url || format('https://github.com/KiiEx/kiiex-backend/releases/tag/{0}', steps.ref.outputs.value) }}).

            Generated by `scripts/generate_api_reference.py`.
          labels: |
            automated
            api-reference
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
